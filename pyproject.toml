[project]
name = "pctl"
version = "0.4.1"
description = "Fast platform CLI for AWS, Azure and other SaaS providers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lefteris Agrianitis", email = "lagrianitis@users.noreply.github.com" }]
keywords = ["cli", "platform", "azure", "microsoft-graph", "aws", "dynamodb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "orjson>=3.10",
    "boto3>=1.34",
]

[project.optional-dependencies]
# Optional speed-ups: uvloop replaces the asyncio event loop, h2 enables HTTP/2
# multiplexing against Microsoft Graph. Both are picked up automatically when present.
fast = [
    "uvloop>=0.19; sys_platform != 'win32'",
    "h2>=4.1",
]
# Fallback credential chain (az login, managed identity, workload identity).
# Only needed when you are not using a client secret.
azure = ["azure-identity>=1.17"]

[project.urls]
Homepage = "https://github.com/lagrianitis/pctl"
Source = "https://github.com/lagrianitis/pctl"
Issues = "https://github.com/lagrianitis/pctl/issues"
Documentation = "https://github.com/lagrianitis/pctl/wiki"
Changelog = "https://github.com/lagrianitis/pctl/releases"

[project.scripts]
pctl = "pctl.__main__:main"

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",     # -n auto: run tests across CPUs
    "pytest-asyncio>=0.23",
    "respx>=0.21",           # mocks httpx, used for Microsoft Graph
    "moto[dynamodb]>=5.0",   # mocks AWS, used for DynamoDB
]
dev = [
    { include-group = "test" },
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src/pctl", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/pctl"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "src/test"]
extend-exclude = ["IGNORE-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
# Makes `from helpers import ...` work from every tier without __init__.py files.
pythonpath = ["src/test"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "unit: pure functions, no I/O and no mocks",
    "smoke: CLI surface only, no provider fakes, must stay under a second",
    "e2e: the real command path, with only the provider boundary faked",
]


