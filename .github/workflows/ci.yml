name: CI

on:
  # Pull requests are the gate: that is where tests must pass, before anything
  # reaches main. Pushes are scoped to main so a branch push does not also fire a
  # second run in which `test` reports itself skipped.
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # Pull requests, plus main after a merge. Not releases.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Lint needs the dev group (ruff) only, no runtime extras.
      # --no-install-project skips building pctl itself. ruff does not need the package
      # importable, and building it would make this job depend on the wheel target and
      # the readme file resolving, which is not what lint is here to check.
      - name: Install dependencies
        run: uv sync --frozen --no-install-project

      # --no-sync is required, not cosmetic: `uv run` syncs before running, which would
      # build the project again and undo --no-install-project above.
      - name: Ruff check
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

  test:
    # Pull requests only, and deliberately so: the point is to catch a failure before
    # it reaches main, not to discover it on the merge commit or at release time.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen installs exactly what uv.lock pins instead of re-resolving.
      - name: Install dependencies
        run: uv sync --frozen --extra fast --extra azure

      - name: Tests
        run: uv run pytest -n auto

  wiki-changes:
    # A workflow-level `paths:` filter would also skip lint and test, so the docs/wiki
    # check lives in a job of its own. A release always counts as changed: the sync
    # below is idempotent, so publishing with nothing to change pushes nothing, and the
    # wiki can never fall behind because an earlier run saw no diff.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      # Full history so the pull request's base commit is available to diff against.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs/wiki changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- docs/wiki; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  wiki:
    # docs/wiki in this repo is the source of truth; the GitHub wiki repository is a
    # mirror of it. On a pull request this validates the pages and reports what would
    # change in the wiki, and pushes nothing: a wiki has one live version, so there is
    # nothing to preview into. A published release pushes the docs/wiki of the release
    # tag, so the wiki always describes a version someone can actually install.
    needs: wiki-changes
    if: needs.wiki-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Wiki links are page names without an extension, so a link to a page that does not
      # exist is only a dead link once published. Subdirectories are rejected because a
      # wiki page is addressed by its file name alone.
      - name: Validate pages
        run: |
          status=0
          [ -f docs/wiki/Home.md ] || { echo "::error::docs/wiki/Home.md is missing"; status=1; }
          nested="$(find docs/wiki -mindepth 2 -type f)"
          if [ -n "$nested" ]; then
            echo "::error::The wiki is flat; move these files into docs/wiki: ${nested}"
            status=1
          fi
          for page in docs/wiki/*.md; do
            while IFS= read -r target; do
              [ -f "docs/wiki/${target}.md" ] || {
                echo "::error file=${page}::broken wiki link: ${target}"
                status=1
              }
            done < <(grep -oE '\]\([^)#: ]+[)#]' "$page" | sed -E 's/^\]\(//; s/[)#]$//' | sort -u)
          done
          exit "$status"

      # The token travels in a request header rather than the clone URL, so it never lands
      # in .git/config or in a remote URL printed by git.
      - name: Sync wiki
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth}"
          wiki_git() { git -c "http.extraheader=AUTHORIZATION: basic ${auth}" "$@"; }

          if ! wiki_git clone --quiet "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki; then
            echo "::error::Cannot clone the wiki. Enable Wikis in the repository settings and save one page in the Wiki tab once: that creates the wiki repository."
            exit 1
          fi

          rsync -a --delete --exclude '.git' docs/wiki/ wiki/
          git -C wiki add --all

          {
            echo "### Wiki changes"
            if git -C wiki diff --cached --quiet; then
              echo "The wiki already matches docs/wiki."
            else
              echo '```'
              git -C wiki status --short
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if git -C wiki diff --cached --quiet; then
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != release ]; then
            echo "Pull request: dry run, nothing pushed."
            exit 0
          fi

          git -C wiki -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "docs: sync wiki from ${GITHUB_SHA::7}"
          wiki_git -C wiki push origin HEAD

  tag:
    # Published releases only: version check and tagging happen nowhere else.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags: the uniqueness check reads refs/tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # pyproject.toml is the single source of truth for the version.
      # --no-project keeps this off the project environment: tomllib is stdlib.
      - name: Read version from pyproject.toml
        id: version
        run: |
          version="$(uv run --no-project python -c \
            'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "pyproject version: ${version}"

      # A GitHub release carries its own tag name; it must match pyproject.
      - name: Check release tag matches pyproject version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match pyproject version tag '$EXPECTED_TAG'." \
                 "Bump [project].version in pyproject.toml or retag the release."
            exit 1
          fi

      # Reject a version that has already shipped. An existing tag on the same
      # commit is the release event creating it, so that case is not a reuse.
      - name: Check version is not already released
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}" || true)"
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::Version ${TAG} is already released at ${existing}." \
                 "Bump [project].version in pyproject.toml."
            exit 1
          fi

      - name: Create tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already points at this commit, nothing to create."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
